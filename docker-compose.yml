services:

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    command: daphne -b 0.0.0.0 -p 8000 chatapp.asgi:application

  redis:
    image: redis:7
    ports:
      - "6379:6379"
